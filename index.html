
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Luas Kolam</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 to-blue-300 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white shadow-2xl rounded-2xl p-6 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">💧 Kalkulator Luas Kolam</h2>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-600">Debit Air (liter/detik):</label>
        <input type="number" id="debit" class="w-full p-2 mt-1 border rounded-lg" step="0.01">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-600">Durasi Aliran per Hari (jam):</label>
        <input type="number" id="durasi" class="w-full p-2 mt-1 border rounded-lg">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-600">Periode Penampungan (hari):</label>
        <input type="number" id="periode" class="w-full p-2 mt-1 border rounded-lg">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-600">Kedalaman Kolam (meter):</label>
        <input type="number" id="kedalaman" class="w-full p-2 mt-1 border rounded-lg" step="0.1">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-600">Kehilangan Air (%):</label>
        <input type="number" id="kehilangan" class="w-full p-2 mt-1 border rounded-lg" value="0" step="1">
      </div>

      <button onclick="hitung()" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold transition">
        🔍 Hitung
      </button>

      <div id="hasil" class="mt-4 text-sm bg-blue-50 text-gray-800 p-4 rounded-lg shadow hidden"></div>
    </div>
  </div>

  <script>
    function hitung() {
      const debit = parseFloat(document.getElementById('debit').value) / 1000;
      const durasi = parseFloat(document.getElementById('durasi').value);
      const periode = parseFloat(document.getElementById('periode').value);
      const kedalaman = parseFloat(document.getElementById('kedalaman').value);
      const kehilangan = parseFloat(document.getElementById('kehilangan').value);

      const hasilDiv = document.getElementById('hasil');

      if (isNaN(debit) || isNaN(durasi) || isNaN(periode) || isNaN(kedalaman)) {
        hasilDiv.innerText = '⚠️ Mohon isi semua kolom dengan benar.';
        hasilDiv.classList.remove('hidden');
        return;
      }

      const waktuTotalDetik = durasi * 3600 * periode;
      let volume = debit * waktuTotalDetik;

      const faktorKehilangan = (100 - kehilangan) / 100;
      volume = volume / faktorKehilangan;

      const luasKolam = volume / kedalaman;

      hasilDiv.innerHTML =
        `<strong>Total Volume Air:</strong> ${volume.toFixed(2)} m³<br>
         <strong>Luas Kolam yang Dibutuhkan:</strong> ${luasKolam.toFixed(2)} m²`;
      hasilDiv.classList.remove('hidden');
    }
  </script>
</body>
</html>
