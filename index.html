
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalkulator Kolam Sedimen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-100 to-blue-200 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-xl">
    <h1 class="text-xl font-bold text-center text-green-700 mb-6">🧮 Kalkulator Kolam Sedimen</h1>

    <div class="grid gap-4">
      <div><label class="block text-sm">Debit Maksimum (m³/s):</label><input id="debit" type="number" step="0.01" class="w-full p-2 border rounded"/></div>
      <div><label class="block text-sm">Kecepatan Aliran (m/s):</label><input id="velocity" type="number" step="0.01" class="w-full p-2 border rounded"/></div>
      <div><label class="block text-sm">Tinggi Kolam (m):</label><input id="tinggi" type="number" step="0.01" class="w-full p-2 border rounded"/></div>
      <div><label class="block text-sm">Lebar Kolam (m):</label><input id="lebar" type="number" step="0.01" class="w-full p-2 border rounded"/></div>
      <div><label class="block text-sm">TSS (mg/L):</label><input id="tss" type="number" step="0.01" class="w-full p-2 border rounded"/></div>
      <div><label class="block text-sm">Efisiensi Pengendapan (%):</label><input id="efisiensi" type="number" step="0.1" class="w-full p-2 border rounded"/></div>
      <div><label class="block text-sm">Hujan Harian (mm/hari):</label><input id="hujan" type="number" step="0.1" class="w-full p-2 border rounded"/></div>
    </div>

    <button onclick="hitung()" class="mt-6 w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-semibold">Hitung</button>

    <div id="hasil" class="mt-6 bg-blue-50 p-4 rounded-lg text-sm hidden"></div>
  </div>

  <script>
    function hitung() {
      const debit = parseFloat(document.getElementById('debit').value);
      const velocity = parseFloat(document.getElementById('velocity').value);
      const tinggi = parseFloat(document.getElementById('tinggi').value);
      const lebar = parseFloat(document.getElementById('lebar').value);
      const tss = parseFloat(document.getElementById('tss').value); // mg/L
      const efisiensi = parseFloat(document.getElementById('efisiensi').value); // %
      const hujan = parseFloat(document.getElementById('hujan').value); // mm/hari

      const hasilDiv = document.getElementById('hasil');

      if ([debit, velocity, tinggi, lebar, tss, efisiensi, hujan].some(isNaN)) {
        hasilDiv.innerText = '⚠️ Mohon isi semua kolom dengan angka yang valid.';
        hasilDiv.classList.remove('hidden');
        return;
      }

      const panjangKolam = debit / (velocity * tinggi); // m
      const luasKolam = panjangKolam * lebar; // m²
      const volumeKolam = luasKolam * tinggi; // m³

      const debitLiterPerDetik = debit * 1000; // L/s
      const totalAirHarian = debitLiterPerDetik * 3600 * 24 / 1000; // m³/hari
      const tssKgPerHari = totalAirHarian * tss / 1000; // kg/hari
      const sedimenTertangkap = tssKgPerHari * (efisiensi / 100); // kg/hari

      const densitasSedimen = 1300; // kg/m³ rata-rata
      const volumeSedimenPerHari = sedimenTertangkap / densitasSedimen; // m³/hari
      const hariPenuh = volumeKolam / volumeSedimenPerHari;
      const maintenance = hariPenuh / 2;

      hasilDiv.innerHTML =
        `<strong>Luas Kolam:</strong> ${luasKolam.toFixed(2)} m²<br>
         <strong>Volume Kolam:</strong> ${volumeKolam.toFixed(2)} m³<br>
         <strong>Waktu Penuh Sedimen:</strong> ${hariPenuh.toFixed(0)} hari (~${(hariPenuh/30).toFixed(1)} bulan)<br>
         <strong>Periode Maintenance:</strong> ${maintenance.toFixed(0)} hari sekali`;
      hasilDiv.classList.remove('hidden');
    }
  </script>
</body>
</html>
